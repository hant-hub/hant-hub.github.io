<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blocky Animal</title>
</head>

Elijah Hantman
<div />
ehantman@ucsc.edu 
<div />

<body onload="main()">
    <p id = "frame" > </p>
    <p id = "fps" > </p>

<canvas id="webgl" width="400" height="400">
Please use the browser supporting "canvas".
</canvas>

<div />
Animation: <select name = "Animation" id = "anim">
    <option value = "walk">Walk</option>
    <option value = "sit">Sit</option>
    <option value = "sit-rev">Sit Reverse</option>
    <option value = "sit-idle">Sit-Idle</option>
</select>
Frame Number: <input id = "frame-num" type = "number" min = "0" size = "4"/>
Display Frame: <input id = "frame-toggle" type = "checkbox" />
Play Animation: <input id = "play-toggle" type = "checkbox" />
Dynamic: <input id = "dynamic-toggle" type = "checkbox" />

<div>
<select name = "body-part" id = "selected-part">
    <option value = "body">Body</option>
    <option value = "rear">Rear</option>

    <option value = "neck">Neck</option>
    <option value = "head">Head</option>
    <option value = "rshoulder">Right Shoulder</option>
    <option value = "lshoulder">Left Shoulder</option>

    <option value = "frleg">Front Right Leg</option>
    <option value = "flleg">Front Left Leg</option>
    <option value = "frfoot">Front Right Foot</option>
    <option value = "flfoot">Front Left Foot</option>

    <option value = "rhip">Right Hip</option>
    <option value = "lhip">Left Hip</option>

    <option value = "brleg">Back Right Leg</option>
    <option value = "blleg">Back Left Leg</option>
    <option value = "brfoot">Back Right Foot</option>
    <option value = "blfoot">Back Left Foot</option>

    <option value = "tail">Tail</option>
</select>
<button id = "output-pose">Print Pose</button>
<button id = "reset">Reset Part</button>
<div />
X Rotation: <input type = "range" min = "-180" max = "180" id = "xrot"></input>
X Position: <input type = "range" min = "-3" max = "3" step = "0.1" id = "xpos"></input>
<div />
Y Rotation: <input type = "range" min = "-180" max = "180" id = "yrot"></input>
Y Position: <input type = "range" min = "-3" max = "3" step = "0.1" id = "ypos"></input>
<div />
Z Rotation: <input type = "range" min = "-180" max = "180" id = "zrot"></input>
Z Position: <input type = "range" min = "-3" max = "3" step = "0.1" id = "zpos"></input>
</div>

<div id = "pose-log"></div>

<div />
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="helpers.js"></script>
    <script src="data.js"></script>
    <script src="shaders.js"></script>
    <script src="asgn2.js"></script>

</body>
</html
