<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Draw a point (1)</title>
</head>

<body onload="main()">
<canvas id="webgl" width="400" height="400">
Please use the browser supporting "canvas".
</canvas>
<div />
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="helpers.js"></script>
    <script src="asgn1.js"></script>

<button id = "clear" type = "button"> Clear </button>
<div />
<b>Drawing Mode:</b>
<div />
<button id = "tri" type = "button"> Triangles </button>
<button id = "square" type = "button"> Squares </button>
<button id = "circ" type = "button"> Circles </button>
<div />
R: <input id = "red" min = "0" max = "1" step = "0.01" size = "8" type = "range"/>
<div />
G: <input id = "green" min = "0" max = "1" step = "0.01" size = "8" type = "range"/>
<div />
B: <input id = "blue" min = "0" max = "1" step = "0.01" size = "8" type = "range"/>
<div />
Size: <input id = "size" min = "0.01" max = "10" step = "0.04" size = "8" type = "range"/>



</body>
</html
